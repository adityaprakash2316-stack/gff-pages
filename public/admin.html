
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Her pictures 💌</title>
<style>
:root{--bg:#fff0f6;--card:#fff;--text:#5a1838;--accent:#ff4d8d;--muted:#a05a7d}
@media(prefers-color-scheme:dark){:root{--bg:#22091a;--card:#341126;--text:#ffd9e8;--muted:#e9a6c4}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text);padding:20px}
h1{margin:0 0 4px}.sub{color:var(--muted);margin-bottom:18px}
.login{max-width:340px;margin:12vh auto;background:var(--card);padding:26px;border-radius:20px;text-align:center}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;font-size:16px;margin:12px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:50px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:15px}
button:disabled{opacity:.6;cursor:wait}
button.sm{padding:6px 14px;font-size:13px}
button.gray{background:#8884}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.item{background:var(--card);border-radius:16px;padding:10px;text-align:center}
.item img{width:100%;height:210px;object-fit:cover;border-radius:12px;cursor:pointer}
.tag{display:inline-block;font-size:12px;background:var(--accent);color:#fff;border-radius:20px;padding:2px 10px;margin:8px 0 2px}
.time{font-size:12px;color:var(--muted);margin-bottom:8px}
#big{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}
#big img{max-width:95vw;max-height:92vh;border-radius:12px}
.err{color:#d33;min-height:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="big" onclick="this.style.display='none'">
  <img id="bigimg" alt="Expanded photo">
</div>
<script>
const app = document.getElementById('app');
let refreshing = false;

function loginView(msg = '') {
  app.innerHTML = `
    <div class="login">
      <div style="font-size:48px">🔒</div>
      <h2>Admin</h2>
      <input id="pw" type="password" placeholder="Password"
             autocomplete="current-password">
      <div class="err" id="err"></div>
      <button id="go">Open</button>
    </div>`;

  const password = document.getElementById('pw');
  const error = document.getElementById('err');
  error.textContent = msg;

  const go = async () => {
    const button = document.getElementById('go');
    button.disabled = true;
    error.textContent = '';

    try {
      const response = await fetch('/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: password.value})
      });

      if (response.ok) {
        await load();
      } else {
        error.textContent = response.status === 429
          ? 'Too many attempts. Wait 10 minutes.'
          : 'Incorrect password.';
      }
    } catch {
      error.textContent = 'Connection error. Please try again.';
    } finally {
      if (document.getElementById('go')) {
        document.getElementById('go').disabled = false;
      }
    }
  };

  document.getElementById('go').onclick = go;
  password.onkeydown = event => {
    if (event.key === 'Enter') go();
  };
  password.focus();
}

async function load() {
  if (refreshing) return;
  refreshing = true;

  try {
    const response = await fetch('/admin/list', {cache: 'no-store'});

    if (response.status === 401) {
      loginView();
      return;
    }
    if (!response.ok) throw new Error('Could not load photos');

    const files = await response.json();
    let html = `<h1>Her pictures 💌</h1>
      <div class="sub">${files.length} photo(s) · refreshes every 10 seconds ·
      <button class="sm gray" id="out">Log out</button></div><div class="grid">`;

    for (const file of files) {
      const imageUrl = '/admin/img/' + encodeURIComponent(file.name);
      const safeName = String(file.name).replace(/[&<>"']/g, '');
      html += `<div class="item">
        <img src="${imageUrl}" data-u="${imageUrl}" alt="Photo">
        <div class="tag">${file.kind === 'kiss' ? '😘 Kiss pic' : '🥰 Cute pic'}</div>
        <div class="time">${new Date(file.time).toLocaleString()}</div>
        <a href="${imageUrl}" target="_blank" rel="noopener noreferrer">
          <button class="sm">View / Download</button>
        </a>
        <button class="sm gray" data-del="${encodeURIComponent(safeName)}">Delete</button>
      </div>`;
    }

    if (!files.length) html += '<p>No photos yet. Waiting for her… 🥺</p>';
    app.innerHTML = html + '</div>';

    app.querySelectorAll('.item img').forEach(img => {
      img.onclick = () => {
        document.getElementById('bigimg').src = img.dataset.u;
        document.getElementById('big').style.display = 'flex';
      };
    });

    app.querySelectorAll('[data-del]').forEach(button => {
      button.onclick = async () => {
        if (!confirm('Delete this photo permanently?')) return;

        try {
          const response = await fetch('/admin/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: new URLSearchParams({
              name: decodeURIComponent(button.dataset.del)
            })
          });

          if (response.ok) {
            await load();
          } else {
            alert('Could not delete photo. Please log in again if your session expired.');
          }
        } catch {
          alert('Connection error. Please try again.');
        }
      };
    });

    document.getElementById('out').onclick = async () => {
      await fetch('/admin/logout', {method: 'POST'});
      loginView();
    };
  } catch {
    app.innerHTML = '<p>Could not load photos. Refresh the page to try again.</p>';
  } finally {
    refreshing = false;
  }
}

load();

setInterval(() => {
  if (document.getElementById('big').style.display !== 'flex' &&
      !document.getElementById('pw')) {
    load();
  }
}, 10000);
</script>
</body>
</html>
